[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localguardian"
version = "0.1.0"
description = "Voice-Driven Local LLM Agent for Sandboxed Windows OS and Browser Automation"
readme = "RESEARCH.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6.0",
    "PyYAML>=6.0",
    "httpx>=0.27.0",
    "screen-brightness-control>=0.22.0; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]
mcp = [
    "mcp>=1.2.0",
]
voice = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "openwakeword>=0.6.0",
]
uia = [
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
localguardian = "localguardian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_default_fixture_loop_scope = "function"
